<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线预约 - YiClinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>在线预约</h1>
        <nav>
            <ul>
                <li><a href="index.html">主页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>在线预约</h2>
        <form>
            <label for="name">姓名:</label>
            <input type="text" id="name" name="name" placeholder="请输入您的姓名">
            
            <label for="phone">电话:</label>
            <input type="text" id="phone" name="phone" placeholder="请输入您的电话">
            
            <label for="date">预约日期:</label>
            <input type="date" id="date" name="date">
            
            <label for="service">选择服务:</label>
            <select id="service" name="service">
                <option value="acupuncture">针灸</option>
                <option value="herbal">中药调理</option>
                <option value="massage">推拿</option>
            </select>
            
            <button type="submit">提交</button>
        </form>
    </main>

    <footer>
        <p>© 2025 YiClinic. All Rights Reserved.</p>
    </footer>
</body>
</html>
